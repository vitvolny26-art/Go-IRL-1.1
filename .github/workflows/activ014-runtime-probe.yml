name: ACTIV014 Runtime Probe

on:
  push:
    branches:
      - ops/activ014-runtime-probe
    paths:
      - .github/workflows/activ014-runtime-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, goirl]
    timeout-minutes: 10
    steps:
      - name: Runtime and production probe
        shell: bash
        run: |
          set -u
          echo "user=$(whoami)"
          echo "host=$(hostname)"
          echo "runner_pwd=$PWD"

          for p in /srv/goirl-1.1 /opt/go-irl-stage /opt/go-irl-stage/dist; do
            if test -e "$p"; then
              stat -c 'path=%n owner=%U group=%G mode=%a' "$p" || true
            else
              echo "path=$p missing"
            fi
          done

          if test -d /srv/goirl-1.1/.git; then
            echo "srv_branch=$(git -C /srv/goirl-1.1 branch --show-current 2>/dev/null || true)"
            echo "srv_head=$(git -C /srv/goirl-1.1 rev-parse HEAD 2>/dev/null || true)"
            echo "srv_origin_main=$(git -C /srv/goirl-1.1 rev-parse origin/main 2>/dev/null || true)"
            echo "srv_status=$(git -C /srv/goirl-1.1 status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
          fi

          echo '--- sudo policy ---'
          sudo -n -l 2>&1 || true

          echo '--- caddy helper inspect ---'
          sudo -n /usr/local/sbin/goirl-caddy-helper inspect 2>&1 || true

          echo '--- canonical HTTP ---'
          http_code=$(curl -L --connect-timeout 10 --max-time 30 -sS -o /tmp/goirl-index.html -w '%{http_code}' https://go-irl.fun/ || true)
          echo "go_irl_fun_http=$http_code"
          test -s /tmp/goirl-index.html && echo "index_bytes=$(wc -c </tmp/goirl-index.html | tr -d ' ')"

          asset=$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/goirl-index.html 2>/dev/null | head -n1 | sed -E 's/^src="([^"]+)"$/\1/' || true)
          echo "asset=$asset"
          if test -n "$asset"; then
            curl -L --connect-timeout 10 --max-time 30 -fsS "https://go-irl.fun${asset}" -o /tmp/goirl-app.js || true
            if test -s /tmp/goirl-app.js; then
              echo "asset_bytes=$(wc -c </tmp/goirl-app.js | tr -d ' ')"
              for sha in d67489c e6e7e0d 098c8e5; do
                if grep -Fq "$sha" /tmp/goirl-app.js; then
                  echo "bundle_contains_$sha=yes"
                else
                  echo "bundle_contains_$sha=no"
                fi
              done
            fi
          fi

          sw_code=$(curl -L --connect-timeout 10 --max-time 30 -sS -o /tmp/goirl-sw.js -w '%{http_code}' https://go-irl.fun/service-worker.js || true)
          echo "service_worker_http=$sw_code"
          if test -s /tmp/goirl-sw.js && grep -Fq 'go-irl-offline-v5' /tmp/goirl-sw.js; then
            echo "service_worker_marker=go-irl-offline-v5"
          else
            echo "service_worker_marker=missing"
          fi
