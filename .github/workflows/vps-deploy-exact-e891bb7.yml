name: GO IRL VPS Deploy Exact e891bb7

on:
  push:
    branches:
      - deploy/vps-exact-e891bb7-20260904

permissions:
  contents: read

concurrency:
  group: go-irl-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, goirl]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout authorized exact commit
        uses: actions/checkout@v4
        with:
          ref: e891bb74c6df21d55fa3e21e1ad467d2e3d4df14
          fetch-depth: 0

      - name: Verify exact merged main SHA
        shell: bash
        run: |
          set -euo pipefail
          requested='e891bb74c6df21d55fa3e21e1ad467d2e3d4df14'
          test "$(git rev-parse HEAD)" = "$requested"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$requested"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm run build

      - name: Deploy exact bundle to VPS stage
        shell: bash
        run: |
          set -euo pipefail
          requested='e891bb74c6df21d55fa3e21e1ad467d2e3d4df14'
          sudo -n /usr/local/sbin/go-irl-stage-publish preflight
          sudo -n /usr/local/sbin/go-irl-stage-publish publish "$requested" "${GITHUB_RUN_ID}"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          requested='e891bb74c6df21d55fa3e21e1ad467d2e3d4df14'
          health_ok() {
            curl --fail --silent --show-error --location --max-time 20 https://go-irl.fun/ >/dev/null
            curl --fail --silent --show-error --location --max-time 20 https://go-irl.fun/service-worker.js | grep -q 'go-irl-offline-v5'
          }
          if ! health_ok; then
            sudo -n /usr/local/sbin/go-irl-stage-publish rollback "$requested" "${GITHUB_RUN_ID}"
            exit 1
          fi

      - name: Record exact publish evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "requested=e891bb74c6df21d55fa3e21e1ad467d2e3d4df14"
          sudo -n /usr/local/sbin/go-irl-stage-publish preflight
          test -s /var/lib/go-irl-stage-publish/last-run
          sudo -n cat /var/lib/go-irl-stage-publish/last-run || true
          curl -sS -o /dev/null -w 'root=%{http_code}\n' --max-time 20 https://go-irl.fun/
          curl -sS -o /tmp/go-irl-sw.$$ -w 'sw=%{http_code}\n' --max-time 20 https://go-irl.fun/service-worker.js
          grep -q 'go-irl-offline-v5' /tmp/go-irl-sw.$$
          rm -f /tmp/go-irl-sw.$$
