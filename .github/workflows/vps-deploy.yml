name: GO IRL VPS Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact merged main SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: go-irl-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, goirl]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify exact merged main SHA
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.commit_sha }}'
          test "$(git rev-parse HEAD)" = "$requested"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$requested"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VITE_SUPABASE_URL:?Missing production VITE_SUPABASE_URL secret}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?Missing production VITE_SUPABASE_PUBLISHABLE_KEY secret}"
          pnpm run build
          pnpm run bundle:check
          grep --recursive --fixed-strings --quiet -- "$VITE_SUPABASE_URL" dist
          grep --recursive --fixed-strings --quiet -- "$VITE_SUPABASE_PUBLISHABLE_KEY" dist

      - name: Deploy exact bundle to VPS stage
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/go-irl-stage-publish preflight
          sudo -n /usr/local/sbin/go-irl-stage-publish publish '${{ inputs.commit_sha }}' "${GITHUB_RUN_ID}"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          health_ok() {
            curl --fail --silent --show-error --location --max-time 20 https://go-irl.fun/ >/dev/null
            curl --fail --silent --show-error --location --max-time 20 https://go-irl.fun/service-worker.js | grep -q 'go-irl-offline-v5'
          }
          if ! health_ok; then
            sudo -n /usr/local/sbin/go-irl-stage-publish rollback '${{ inputs.commit_sha }}' "${GITHUB_RUN_ID}"
            exit 1
          fi
