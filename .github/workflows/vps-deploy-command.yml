name: GO IRL VPS Deploy Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write

concurrency:
  group: go-irl-vps-deploy-command
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 1115 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/deploy-vps ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve exact requested SHA
        id: target
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          body="${COMMENT_BODY//$'\r'/}"
          if [[ ! "$body" =~ ^/deploy-vps[[:space:]]+([0-9a-fA-F]{40})[[:space:]]*$ ]]; then
            echo "BLOCKED: expected /deploy-vps followed by one exact 40-character SHA" >&2
            exit 1
          fi
          sha="$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify requested SHA is current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$TARGET_SHA" = "$current_main"

      - name: Verify exact-main CI is green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          green_count="$({
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs" \
              --method GET \
              -f head_sha="$TARGET_SHA" \
              -f event=push \
              -f status=completed \
              -f per_page=100
          } | jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success")] | length')"
          test "$green_count" -ge 1

      - name: Dispatch a new exact-SHA VPS deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run vps-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f commit_sha="$TARGET_SHA"
