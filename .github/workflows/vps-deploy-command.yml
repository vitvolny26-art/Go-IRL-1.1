name: GO IRL VPS Deploy Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write

concurrency:
  group: go-irl-vps-deploy-command
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 1115 &&
      (
        startsWith(github.event.comment.body, '/deploy-vps ') ||
        startsWith(github.event.comment.body, '/deploy-cinema-worker ')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify trusted deploy-command author
        shell: bash
        env:
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_APP: ${{ github.event.comment.performed_via_github_app.slug }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "$COMMENT_USER" == "$REPOSITORY_OWNER" ]]; then
            exit 0
          fi
          if [[ "$COMMENT_ASSOCIATION" == "OWNER" && "$COMMENT_APP" == "chatgpt-codex-connector" ]]; then
            exit 0
          fi
          echo "BLOCKED: deploy command must come from the repository owner or the trusted owner-authorized ChatGPT Codex Connector" >&2
          exit 1

      - name: Resolve exact requested SHA
        id: target
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          body="${COMMENT_BODY//$'\r'/}"
          if [[ "$body" =~ ^/deploy-vps[[:space:]]+([0-9a-fA-F]{40})[[:space:]]*$ ]]; then
            workflow="vps-deploy.yml"
          elif [[ "$body" =~ ^/deploy-cinema-worker[[:space:]]+([0-9a-fA-F]{40})[[:space:]]*$ ]]; then
            workflow="cinema-worker-install.yml"
          else
            echo "BLOCKED: expected /deploy-vps or /deploy-cinema-worker followed by one exact 40-character SHA" >&2
            exit 1
          fi
          sha="$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"

      - name: Verify requested SHA is current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$TARGET_SHA" = "$current_main"

      - name: Verify exact-main CI is green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          green_count="$({
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs" \
              --method GET \
              -f head_sha="$TARGET_SHA" \
              -f event=push \
              -f status=completed \
              -f per_page=100
          } | jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success")] | length')"
          test "$green_count" -ge 1

      - name: Dispatch a new exact-SHA production deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_WORKFLOW: ${{ steps.target.outputs.workflow }}
        run: |
          set -euo pipefail
          case "$TARGET_WORKFLOW" in
            vps-deploy.yml|cinema-worker-install.yml) ;;
            *)
              echo "BLOCKED: unexpected deployment workflow" >&2
              exit 1
              ;;
          esac
          gh workflow run "$TARGET_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f commit_sha="$TARGET_SHA"
