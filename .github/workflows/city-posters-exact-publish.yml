name: City Posters Exact Publish

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact merged main SHA to publish from
        required: true
        type: string
      event_ids:
        description: Comma-separated City Posters event UUIDs (max 20)
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: go-irl-city-posters-exact-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.number == 1296 &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/city-posters-publish ')
      )
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Resolve exact publication request
        id: request
        env:
          DISPATCH_SHA: ${{ inputs.commit_sha }}
          DISPATCH_EVENT_IDS: ${{ inputs.event_ids }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import os, re, shlex
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              commit_sha = os.environ["DISPATCH_SHA"].strip()
              event_ids = os.environ["DISPATCH_EVENT_IDS"].strip()
          else:
              parts = shlex.split(os.environ["COMMENT_BODY"])
              if len(parts) != 3 or parts[0] != "/city-posters-publish":
                  raise SystemExit("invalid publish command")
              commit_sha, event_ids = parts[1], parts[2]
          if not re.fullmatch(r"[0-9a-f]{40}", commit_sha, re.I):
              raise SystemExit("invalid commit_sha")
          print("commit_sha=" + commit_sha)
          print("event_ids=" + event_ids)
          PY

      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.commit_sha }}
          fetch-depth: 0

      - name: Verify exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ steps.request.outputs.commit_sha }}'
          test "$(git rev-parse HEAD)" = "$requested"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$requested"

      - name: Validate exact event IDs
        id: targets
        env:
          EVENT_IDS: ${{ steps.request.outputs.event_ids }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import json, os, re
          values = [value.strip() for value in os.environ["EVENT_IDS"].split(",") if value.strip()]
          uuid = re.compile(r"^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$", re.I)
          if not values or len(values) > 20 or len(values) != len(set(values)) or any(not uuid.fullmatch(value) for value in values):
              raise SystemExit("invalid event_ids")
          print("event_ids_json=" + json.dumps(values, separators=(",", ":")))
          print("event_count=" + str(len(values)))
          PY

      - name: Publish exact City Posters events
        env:
          EVENT_IDS_JSON: ${{ steps.targets.outputs.event_ids_json }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Missing production SUPABASE_URL secret}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?Missing production SUPABASE_SERVICE_ROLE_KEY secret}"
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({"action": "publish_city_poster_events", "eventIds": json.loads(os.environ["EVENT_IDS_JSON"])}, separators=(",", ":")))
          PY
          )"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST "${SUPABASE_URL}/functions/v1/telegramEventSupergroup" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --data "$payload")"
          test "$status" -ge 200 && test "$status" -lt 300
          python3 - "$response_file" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          results = data.get("cityPosterPublications")
          if not isinstance(results, list):
              raise SystemExit("missing cityPosterPublications")
          failures = []
          for item in results:
              event_id = item.get("eventId", "unknown") if isinstance(item, dict) else "unknown"
              result = item.get("result") if isinstance(item, dict) else None
              if isinstance(result, dict) and result.get("published") is True:
                  state = "reused" if result.get("reused") is True else "published"
                  print(f"publication_event={event_id} state={state}")
                  continue
              skipped = result.get("skipped") if isinstance(result, dict) else None
              print(f"publication_event={event_id} state=failed skipped={skipped or 'unknown'}")
              failures.append(event_id)
          if failures:
              raise SystemExit("one or more publications failed: " + ",".join(failures))
          print("publication_result=ok")
          print("publication_count=" + str(len(results)))
          PY
