name: VPS Caddy Capability Inspect

on:
  push:
    branches:
      - diag/vps-caddy-capabilities-20260904

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, goirl]
    timeout-minutes: 5
    steps:
      - name: Inspect active Caddy view and post-deploy runtime
        shell: bash
        run: |
          set -euo pipefail
          echo '--- identity ---'
          hostname
          whoami

          echo '--- bounded Caddyfile view ---'
          sudo -n /usr/local/sbin/goirl-caddy-helper inspect

          echo '--- canonical stage ---'
          test -s /opt/go-irl-stage/dist/index.html
          stat -c '%n inode=%i owner=%U:%G mode=%a size=%s' /opt/go-irl-stage/dist/index.html

          echo '--- artifact equality ---'
          test -s /opt/actions-runner/_work/Go-IRL-1.1/Go-IRL-1.1/dist/index.html
          cmp -s /opt/go-irl-stage/dist/index.html /opt/actions-runner/_work/Go-IRL-1.1/Go-IRL-1.1/dist/index.html
          echo 'stage_index_matches_workspace=yes'

          echo '--- process mount namespace ---'
          found=0
          bad=0
          for mi in /proc/[0-9]*/mountinfo; do
            if grep -qE ' /srv/go-irl([ /]|$)' "$mi" 2>/dev/null; then
              echo "MOUNTINFO=$mi"
              grep -E ' /srv/go-irl([ /]|$)' "$mi" 2>/dev/null || true
              found=1
              if grep -q 'deleted' "$mi" 2>/dev/null; then
                bad=1
              fi
            fi
          done
          test "$found" -eq 1
          test "$bad" -eq 0

          echo '--- public health ---'
          root_http=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://go-irl.fun/)
          sw_http=$(curl -sS -o /tmp/go-irl-sw.$$ -w '%{http_code}' --max-time 20 https://go-irl.fun/service-worker.js)
          echo "root=$root_http"
          echo "sw=$sw_http"
          test "$root_http" = '200'
          test "$sw_http" = '200'
          grep -q 'go-irl-offline-v5' /tmp/go-irl-sw.$$
          rm -f /tmp/go-irl-sw.$$
          echo 'POST_DEPLOY_RUNTIME_GREEN'
