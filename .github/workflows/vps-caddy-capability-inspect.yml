name: VPS Caddy Capability Inspect

on:
  push:
    branches:
      - diag/vps-caddy-capabilities-20260904

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, goirl]
    timeout-minutes: 5
    steps:
      - name: Inspect active Caddy view and mount namespace
        shell: bash
        run: |
          set -u
          echo '--- identity ---'
          hostname
          whoami

          echo '--- bounded Caddyfile view ---'
          sudo -n /usr/local/sbin/goirl-caddy-helper inspect 2>&1 || true
          sudo -n /usr/local/sbin/goirl-caddy-helper show 2>&1 || true

          echo '--- Caddy processes ---'
          pgrep -a caddy 2>&1 || true
          pgrep -af 'caddy|n8n-caddy' 2>&1 || true

          echo '--- process mount namespaces mentioning srv/go-irl ---'
          found=0
          for mi in /proc/[0-9]*/mountinfo; do
            if grep -qE ' /srv/go-irl([ /]|$)|go-irl-stage' "$mi" 2>/dev/null; then
              echo "MOUNTINFO=$mi"
              grep -E ' /srv/go-irl([ /]|$)|go-irl-stage' "$mi" 2>/dev/null || true
              found=1
            fi
          done
          [ "$found" -eq 1 ] || echo 'process_mount_match=NONE_OR_UNREADABLE'

          echo '--- public health ---'
          curl -sS -o /dev/null -w 'root=%{http_code}\n' --max-time 20 https://go-irl.fun/ || true
          curl -sS -o /dev/null -w 'sw=%{http_code}\n' --max-time 20 https://go-irl.fun/service-worker.js || true
          echo 'VPS_CADDY_ACTIVE_VIEW_DONE'
