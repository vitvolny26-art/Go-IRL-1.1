name: Cinema Worker Install

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact merged main SHA to install
        required: true
        type: string
      rewrite_config:
        description: Rewrite production worker config from GitHub environment secrets
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: go-irl-cinema-worker-production
  cancel-in-progress: false

jobs:
  install:
    runs-on: [self-hosted, Linux, X64, goirl]
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.commit_sha }}'
          test "$(git rev-parse HEAD)" = "$requested"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$requested"

      - name: Enable pnpm and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build:cinema-ingestion-worker

      - name: Install Cinema worker runtime
        shell: bash
        run: |
          set -euo pipefail
          helper=/usr/local/sbin/go-irl-cinema-workerctl
          sudo -n "$helper" preflight
          sudo -n "$helper" install-runtime '${{ inputs.commit_sha }}' "$GITHUB_WORKSPACE"

      - name: Rewrite Cinema worker config
        if: ${{ inputs.rewrite_config }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Missing production SUPABASE_URL secret}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?Missing production SUPABASE_SERVICE_ROLE_KEY secret}"

          helper=/usr/local/sbin/go-irl-cinema-workerctl
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          chmod 600 "$env_file"
          {
            printf 'GO_IRL_CINEMA_WORKER_ENABLED=true\n'
            printf 'GO_IRL_CINEMA_WORKER_ID=cinema-worker:production\n'
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            if [ -n "${TMDB_API_READ_ACCESS_TOKEN:-}" ]; then
              printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
            fi
          } >"$env_file"

          if [ -n "${TMDB_API_READ_ACCESS_TOKEN:-}" ]; then
            echo 'tmdb_enrichment_configured=true'
          else
            echo 'tmdb_enrichment_configured=false'
          fi
          sudo -n "$helper" install-config '${{ inputs.commit_sha }}' "$env_file"

      - name: Activate Cinema worker runtime
        shell: bash
        run: |
          set -euo pipefail
          helper=/usr/local/sbin/go-irl-cinema-workerctl
          service=go-irl-cinema-worker.service
          requested='${{ inputs.commit_sha }}'

          restart_output="$(mktemp)"
          trap 'rm -f "$restart_output"' EXIT
          if sudo -n "$helper" restart "$requested" >"$restart_output" 2>&1; then
            cat "$restart_output"
          else
            cat "$restart_output"
            grep -q 'allowed actions:.*start <sha>' "$restart_output"
            if grep -q 'restart <sha>' "$restart_output"; then
              echo 'BLOCKED: helper exposed restart but restart failed' >&2
              exit 2
            fi

            if systemctl is-active --quiet "$service"; then
              previous_pid="$(systemctl show --property MainPID --value "$service")"
              case "$previous_pid" in
                ''|*[!0-9]*) echo 'BLOCKED: invalid Cinema worker MainPID' >&2; exit 2 ;;
              esac
              test "$previous_pid" -gt 1
              test "$(stat -c %u "/proc/$previous_pid")" = "$(id -u)"
              kill -KILL "$previous_pid"

              restarted=false
              for _ in $(seq 1 20); do
                current_pid="$(systemctl show --property MainPID --value "$service")"
                if systemctl is-active --quiet "$service" &&
                  [ "$current_pid" -gt 1 ] &&
                  [ "$current_pid" != "$previous_pid" ]; then
                  restarted=true
                  break
                fi
                sleep 1
              done
              if [ "$restarted" != true ]; then
                sudo -n "$helper" start "$requested"
              fi
            else
              sudo -n "$helper" start "$requested"
            fi
            echo 'cinema_worker_legacy_restart=ok'
          fi
          echo 'cinema_worker_restart=ok'

      - name: Verify Cinema worker
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          sudo -n /usr/local/sbin/go-irl-cinema-workerctl status
          sudo -n /usr/local/sbin/go-irl-cinema-workerctl logs
