<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0b0e12" />
    <title>GO IRL — Share</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 10%, #243017 0, #10150d 28%, #080a0d 72%); color: #f6f7f8; }
      main { width: min(100%, 420px); padding: 30px 24px 24px; border: 1px solid rgba(184, 255, 63, .28); border-radius: 28px; background: rgba(10, 13, 16, .9); box-shadow: 0 24px 70px rgba(0, 0, 0, .45); text-align: center; }
      .logo { display: inline-grid; place-items: center; width: 72px; height: 72px; margin-bottom: 18px; border-radius: 22px; background: #fff; }
      .logo img { width: 48px; height: 48px; }
      h1 { margin: 0; font-size: clamp(28px, 8vw, 38px); line-height: 1.05; letter-spacing: -.04em; }
      p { margin: 14px auto 0; max-width: 31ch; color: #b8bdc5; font-size: 16px; line-height: 1.5; }
      .event { margin: 22px 0; padding: 16px; border-radius: 18px; background: #14191f; text-align: left; }
      .event strong, .event span { display: block; overflow-wrap: anywhere; }
      .event strong { font-size: 18px; }
      .event span { margin-top: 5px; color: #969da7; font-size: 14px; }
      button { width: 100%; min-height: 56px; border: 0; border-radius: 17px; font: inherit; font-weight: 800; cursor: pointer; }
      #share { background: #b8ff3f; color: #10140b; font-size: 17px; }
      #download, #open-messenger, #copy { margin-top: 10px; background: transparent; color: #d8dce1; border: 1px solid #343a43; }
      button:disabled { cursor: wait; opacity: .55; }
      [hidden] { display: none !important; }
      #status { min-height: 24px; margin-top: 14px; color: #b8ff3f; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <span class="logo"><img src="/icons/messenger.svg" alt="" /></span>
      <h1 id="heading">Share invitation</h1>
      <p id="hint">Prepare the JPEG, then choose Messenger in the Android share menu.</p>
      <section class="event" aria-label="Event">
        <strong id="event-title">GO IRL</strong>
        <span id="event-details"></span>
      </section>
      <button id="share" type="button" disabled>Share JPEG and link</button>
      <button id="download" type="button" hidden>Download JPEG</button>
      <button id="open-messenger" type="button" hidden>Open Messenger</button>
      <button id="copy" type="button">Copy invitation</button>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script>
      const translations = {
        ru: { heading: "Поделиться приглашением", hint: "Подготовим JPEG. Затем выберите Messenger в системном меню Android.", preparing: "Загружаем карточку…", share: "Отправить JPEG и ссылку", shareLink: "Поделиться ссылкой", download: "Скачать JPEG", open: "Открыть Messenger", copy: "Скопировать приглашение", copied: "Ссылка и приглашение скопированы", ready: "Карточка готова к отправке", unavailable: "Не удалось отправить JPEG через меню. Скачайте файл, прикрепите его в Messenger и вставьте ссылку.", failed: "Карточку не удалось загрузить. Скопируйте ссылку и отправьте её в Messenger.", cancelled: "Отправка отменена" },
        uk: { heading: "Поділитися запрошенням", hint: "Підготуємо JPEG. Потім виберіть Messenger у системному меню Android.", preparing: "Завантажуємо картку…", share: "Надіслати JPEG і посилання", shareLink: "Поділитися посиланням", download: "Завантажити JPEG", open: "Відкрити Messenger", copy: "Скопіювати запрошення", copied: "Посилання та запрошення скопійовано", ready: "Картка готова до надсилання", unavailable: "Не вдалося надіслати JPEG через меню. Завантажте файл, прикріпіть його в Messenger і вставте посилання.", failed: "Не вдалося завантажити картку. Скопіюйте посилання та надішліть її в Messenger.", cancelled: "Надсилання скасовано" },
        cs: { heading: "Sdílet pozvánku", hint: "Připravíme JPEG. Potom vyberte Messenger v systémové nabídce Androidu.", preparing: "Stahuji kartu…", share: "Odeslat JPEG a odkaz", shareLink: "Sdílet odkaz", download: "Stáhnout JPEG", open: "Otevřít Messenger", copy: "Kopírovat pozvánku", copied: "Odkaz a pozvánka zkopírovány", ready: "Karta je připravena ke sdílení", unavailable: "JPEG nelze sdílet přes nabídku. Stáhněte soubor, přiložte ho v Messengeru a vložte odkaz.", failed: "Kartu se nepodařilo stáhnout. Zkopírujte odkaz a pošlete ho v Messengeru.", cancelled: "Sdílení zrušeno" },
        en: { heading: "Share invitation", hint: "We’ll prepare the JPEG. Then choose Messenger in the Android share menu.", preparing: "Preparing the card…", share: "Share JPEG and link", shareLink: "Share link", download: "Download JPEG", open: "Open Messenger", copy: "Copy invitation", copied: "Link and invitation copied", ready: "Card is ready to share", unavailable: "The share menu could not send the JPEG. Download it, attach it in Messenger, and paste the link.", failed: "Could not download the card. Copy the link and send it in Messenger.", cancelled: "Sharing cancelled" }
      };
      const language = (navigator.language || "en").slice(0, 2).toLowerCase();
      const t = translations[language] || translations.en;
      const params = new URLSearchParams(location.search);
      const content = {
        title: params.get("title") || "GO IRL",
        date: params.get("date") || "",
        address: params.get("address") || "",
        url: params.get("url") || "",
        image: params.get("image") || ""
      };
      const text = [[`GO IRL: ${content.title}`, content.date, content.address].filter(Boolean).join("\n"), content.url].filter(Boolean).join("\n\n");
      const status = document.querySelector("#status");
      const shareButton = document.querySelector("#share");
      const downloadButton = document.querySelector("#download");
      const openButton = document.querySelector("#open-messenger");
      let imageFile = null;
      let imageObjectUrl = "";
      document.documentElement.lang = language;
      document.querySelector("#heading").textContent = t.heading;
      document.querySelector("#hint").textContent = t.hint;
      shareButton.textContent = t.share;
      downloadButton.textContent = t.download;
      openButton.textContent = t.open;
      document.querySelector("#copy").textContent = t.copy;
      document.querySelector("#event-title").textContent = content.title;
      document.querySelector("#event-details").textContent = [content.date, content.address].filter(Boolean).join(" · ");

      const copy = async () => {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }
      };

      const setManualFallback = (message) => {
        status.textContent = message;
        shareButton.hidden = true;
        downloadButton.hidden = !imageFile;
        openButton.hidden = false;
      };

      const prepareImage = async () => {
        status.textContent = t.preparing;
        try {
          const imageUrl = new URL(content.image, location.origin);
          if (imageUrl.origin !== location.origin || imageUrl.pathname !== "/api/meta/event-preview" || imageUrl.searchParams.get("format") !== "download") {
            throw new Error("Untrusted card URL");
          }
          const response = await fetch(imageUrl.toString(), { credentials: "same-origin" });
          if (!response.ok) throw new Error(`Card download failed: ${response.status}`);
          const contentType = (response.headers.get("content-type") || "").split(";", 1)[0].trim().toLowerCase();
          if (contentType !== "image/jpeg") throw new Error(`Unexpected card type: ${contentType}`);
          const blob = await response.blob();
          if (!blob.size || blob.size > 8 * 1024 * 1024) throw new Error("Unexpected card size");
          imageFile = new File([blob], "go-irl-card.jpg", { type: "image/jpeg" });
          imageObjectUrl = URL.createObjectURL(imageFile);
          downloadButton.hidden = false;
          status.textContent = t.ready;
        } catch {
          status.textContent = t.failed;
          shareButton.textContent = t.shareLink;
          openButton.hidden = false;
        } finally {
          shareButton.disabled = false;
        }
      };

      shareButton.addEventListener("click", async () => {
        const shareData = imageFile
          ? { files: [imageFile], title: `GO IRL: ${content.title}`, text }
          : { title: `GO IRL: ${content.title}`, text, url: content.url };
        if (typeof navigator.share === "function") {
          try {
            if (imageFile && typeof navigator.canShare === "function" && !navigator.canShare({ files: [imageFile] })) {
              setManualFallback(t.unavailable);
              return;
            }
            await navigator.share(shareData);
            return;
          } catch (error) {
            if (error && error.name === "AbortError") {
              status.textContent = t.cancelled;
              return;
            }
          }
        }
        setManualFallback(imageFile ? t.unavailable : t.failed);
      });

      downloadButton.addEventListener("click", () => {
        if (!imageObjectUrl) return;
        const anchor = document.createElement("a");
        anchor.href = imageObjectUrl;
        anchor.download = "go-irl-card.jpg";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      });

      openButton.addEventListener("click", () => {
        if (/android/i.test(navigator.userAgent)) {
          const link = encodeURIComponent(content.url);
          location.href = `intent://share/?link=${link}&app_id=1332867179009910#Intent;scheme=fb-messenger;package=com.facebook.orca;end`;
          return;
        }
        location.href = `fb-messenger://share/?link=${encodeURIComponent(content.url)}&app_id=1332867179009910`;
      });

      document.querySelector("#copy").addEventListener("click", async () => {
        await copy();
        status.textContent = t.copied;
      });

      window.addEventListener("pagehide", () => {
        if (imageObjectUrl) URL.revokeObjectURL(imageObjectUrl);
      }, { once: true });
      if (content.image) void prepareImage();
      else {
        status.textContent = t.failed;
        shareButton.textContent = t.shareLink;
        shareButton.disabled = false;
        openButton.hidden = false;
      }
    </script>
  </body>
</html>
